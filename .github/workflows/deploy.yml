name: Deploy

on:
  push:
    branches: [main]

env:
  DEPLOY_TARGET: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SERVER_DEPLOY_KEY }}
          known_hosts: ${{ secrets.SERVER_KNOWN_HOSTS }}

      - name: Verify SSH connection
        run: ssh $DEPLOY_TARGET "echo 'SSH OK'"

      - name: Rsync to server
        run: |
          rsync -avz --delete \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='frontend/dist' \
            --exclude='.git' \
            ./ $DEPLOY_TARGET:~/TravelPal/

      - name: Run database migrations
        run: |
          ssh $DEPLOY_TARGET \
            "cd ~/TravelPal && docker compose run --rm backend alembic upgrade head"

      - name: Build & restart
        run: |
          ssh $DEPLOY_TARGET \
            "cd ~/TravelPal && docker compose build && docker compose up -d"