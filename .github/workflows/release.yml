name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read release notes
        id: changelog
        run: |
          NOTES_FILE="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo 'NOTES<<RELEASE_EOF'
              # 剥离 YAML frontmatter（首尾两条 '---' 之间），保留正文；
              # 不依赖 frontmatter 恰好 5 行，模板注释块未删也能稳健处理
              awk '/^---[[:space:]]*$/ { if (!f) { f=1; next } else if (f && !d) { d=1; next } } d { print }' "$NOTES_FILE"
              echo 'RELEASE_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "缺少 docs/releases/${GITHUB_REF_NAME}.md，请补充后再发布" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.NOTES }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
