# ============================================================================
# 依赖安装注意事项
# - langgraph-checkpoint-postgres 依赖 psycopg；psycopg 需 psycopg-binary（提供
#   libpq），否则 import 报 "no pq wrapper available"——故 main 组同时含两者。
# - 国内网络下 poetry 默认连 pypi.org 可能失败（PermissionError / ReadTimeout，
#   且本机 python 联网可能被沙箱拦截）。若 poetry add/install 联网失败：
#   a) 用 pip + 清华源装包（--index-url https://pypi.tuna.tsinghua.edu.cn/simple）；
#   b) 再在可联网处跑 `poetry lock` 落锁（lock 只解析 metadata，不拉大 wheel，
#      比 poetry add 的下载阶段更稳）。Dockerfile 构建亦走清华源。
# - langgraph checkpoint 内部表由 AsyncPostgresSaver.setup() 托管，不进 Alembic；
#   alembic/env.py 用 include_object 排除，保持 alembic check 无漂移。
# ============================================================================
[project]
name = "travelpal"
version = "0.1.0"
description = ""
authors = [
    {name = "xiaojiune",email = "3195675598@qq.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "numpy (>=2.0.0,<3.0.0)",
    "numba (>=0.65.0,<0.66.0)",
    "scikit-learn (>=1.5.0,<2.0.0)",
    "requests (>=2.32.0,<3.0.0)",
    "matplotlib (>=3.10.0,<4.0.0)",
    "streamlit (>=1.40.0,<2.0.0)",
    "openai (>=1.60.0,<2.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "redis (>=5.0.0,<6.0.0)",
    "jieba (>=0.42.0,<0.43.0)",
    "mcp (>=2.0.0,<3.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "langgraph (>=1.2.10,<2.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "bcrypt (>=4.0.0,<6.0.0)",
    "langgraph-checkpoint-postgres (>=3.1.2,<4.0.0)",
    "psycopg-binary (>=3.3.4,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.scripts]
dev = "backend.api.server:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
ruff = "^0.11.0"
pyright = "^1.1.411"

[tool.pyright]
reportMissingImports = false

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.poetry.group.docs.dependencies]
sphinx = "^9"
sphinx-rtd-theme = "^3"
sphinx-autoapi = "^3"
myst-parser = "^5"
sphinxcontrib-redoc = "^1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
